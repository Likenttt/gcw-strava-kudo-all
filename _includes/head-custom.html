<!-- start custom head snippets, customize with your own _includes/head-custom.html file -->

<!-- Setup Google Analytics -->
{% include head-custom-google-analytics.html %}
{% assign kudo_description = page.description | default: site.description %}

<!-- You can set your favicon here -->
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

<meta name="keywords" content="kudoall,garmin,connect,li2niu,newrathon" />
<meta
  name="description"
  content="{{ kudo_description | escape }}"
/>
<title>{{ page.title }}</title>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="{{ '/assets/js/kudo-localization.js' | relative_url }}"></script>
<script id="kudo-acquisition-config" type="application/json">{"providerToken":{{ site.app_store_provider_token | default: '' | jsonify }}}</script>
<script defer src="{{ '/assets/js/kudo-acquisition.js' | relative_url }}"></script>
<link rel="stylesheet" href="{{ asset_path }}" />

<meta name="author" content="li2niu" />

<!-- 添加 Open Graph 协议标签，用于社交媒体分享 -->
<meta property="og:title" content="{{ page.title }}" />
<meta
  property="og:description"
  content="{{ kudo_description | escape }}"
/>
<meta property="og:url" content="{{ site.baseurl }}{{ page.url }}" />
<meta
  property="og:image"
  content="{{ site.baseurl }}screenshots/english-kudoall.png"
/>

<!-- 添加 Twitter 卡片标签，用于 Twitter 分享 -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ page.title }}" />
<meta
  name="twitter:description"
  content="{{ kudo_description | escape }}"
/>
<meta
  name="twitter:image"
  content="{{ site.baseurl }}screenshots/english-kudoall.png"
/>

<!-- end custom head snippets -->
